<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fatal { display: none; position: fixed; top: 8px; left: 8px; right: 8px; z-index: 50;
    background: #c0392b; color: #fff; padding: 8px 12px; font: 14px monospace; border-radius: 4px; }
  #hud { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; color: #fff; }
  #hud-top { position: absolute; top: 10px; left: 12px; text-shadow: 0 1px 3px #000; }
  #hud-stars { font-size: 26px; letter-spacing: 2px; }
  #hud-health { width: 180px; height: 12px; background: rgba(0,0,0,0.55); border: 1px solid #fff; border-radius: 6px; margin-top: 4px; overflow: hidden; }
  #hud-health-fill { height: 100%; width: 100%; background: #2ecc71; }
  #hud-health-text { font-size: 13px; }
  #hud-money { font-size: 20px; font-weight: 700; color: #7dff9a; margin-top: 4px; }
  #hud-ammo, #hud-speed { font-size: 14px; }
  #hud-objective { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 6px; font-size: 15px; max-width: 46vw; text-align: center; }
  #minimap { position: absolute; top: 10px; right: 12px; width: 190px; height: 142px;
    border: 2px solid rgba(255,255,255,0.8); border-radius: 6px; background: #1d3a24; }
  #hud-message { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
    font-size: 15px; text-shadow: 0 1px 3px #000; }
  #hud-dialogue { display: none; position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); border-left: 4px solid #ffe600; padding: 10px 16px; border-radius: 6px;
    font-size: 15px; max-width: 640px; text-align: center; }
  #hud-banner { display: none; position: absolute; top: 38%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: #ffe600; padding: 12px 22px; border-radius: 8px;
    font-size: 22px; font-weight: 800; text-align: center; }
  #hud-controls { position: absolute; bottom: 10px; left: 12px; font-size: 12px; opacity: 0.75; text-shadow: 0 1px 2px #000; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar City: top-down open-world crime game"></canvas>
<div id="fatal" role="alert"></div>
<div id="hud">
  <div id="hud-top">
    <div id="hud-stars">☆☆☆☆☆</div>
    <div id="hud-health"><div id="hud-health-fill"></div></div>
    <div id="hud-health-text">HP 100</div>
    <div id="hud-money">$120</div>
    <div id="hud-ammo">Ammo 48</div>
    <div id="hud-speed"></div>
  </div>
  <div id="hud-objective">◆ Drive to Rosa's Bar</div>
  <canvas id="minimap" width="190" height="142"></canvas>
  <div id="hud-message"></div>
  <div id="hud-dialogue"></div>
  <div id="hud-banner"></div>
  <div id="hud-controls">WASD move/drive · Shift run · E car · F punch · Click shoot · Space handbrake · P pause · M mute</div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
